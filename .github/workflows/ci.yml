          version: ${{ github.run_id }}-${{ github.run_attempt }}-multi_arch_cache_key
          debug: ${{ env.DEBUG }}

  virtual_package:
    runs-on: ubuntu-24.04
    needs: [setup-and-cache]
    name: "Cache virtual package."
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Use archive.ubuntu.com instead of the stalling Azure mirror
        uses: ./.github/actions/use-archive-mirror
      - uses: ./
        with:
          packages: libvips
          version: ${{ github.run_id }}-${{ github.run_attempt }}-virtual_package
          debug: ${{ env.DEBUG }}

  # The single required status check for staging-2 and the gate for releases: it fails when any job
  # above failed or was cancelled (skipped jobs, such as CodeQL on fork PRs, are fine).
  ci-passed:
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    needs:
      [
        setup-and-cache,
        codeql,
        linters,
        action-deps-pinned,
        testing,
        list_all_versions,
        list_versions,
        standard_workflow_install,
        standard_workflow_install_with_new_version,
        standard_workflow_restore,
        standard_workflow_restore_with_packages_out_of_order,
        standard_workflow_add_package,
        standard_workflow_restore_add_package,
        no_packages,
        no_packages_warn,
        no_packages_ignore,
        package_not_found,
        version_contains_spaces,
        regression_36,
        regression_37,
        debug_disabled,
        regression_72_2,
        regression_76,
        regression_79,
        regression_81,
        regression_89,
        regression_106_install,
        regression_106_restore,
        regression_260_install,
        regression_260_restore,
        regression_167_install,
        regression_167_restore,
        multi_arch_cache_key,
        virtual_package,
      ]
    permissions: {}
    steps:
      - name: Require every job to pass
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::At least one CI job ended as '$result'."
              exit 1
            fi
          done
