name: CI

on:
  repository_dispatch:
  # A staging-2 push that passes starts a release candidate (release-candidate.yml); official versions
  # only change when promote.yml starts a release. main-2 re-runs once per promotion (a fast-forward
  # of a commit that already passed), which keeps its CI and coverage badges current. Release lookups
  # by SHA ignore it while it is in progress.
  push:
    branches: [main-2, staging-2]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Run in debug mode."
        type: boolean
        required: false
        default: true

# A newer push to a PR cancels its stale run. Other runs get their own group, so a staging-2 push is never cancelled or dropped: promote.yml looks its result up by SHA.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEBUG: ${{ github.event.inputs.debug || false }}
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  setup-and-cache:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup
        uses: ./.github/actions/setup

      # The integration jobs below run this bundle as the action (uses: ./).
      - name: Upload Action Bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            action.yml
            dist/action/
            dist/scripts/
            .github/actions/use-archive-mirror/
          if-no-files-found: error
          retention-days: 1

  codeql:
    # Fork PRs do not have permission to upload security events.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    needs: setup-and-cache
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          languages: javascript-typescript

      - name: Setup
        uses: ./.github/actions/setup

      - name: Analyze
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4

  linters:
    runs-on: ubuntu-24.04
    needs: setup-and-cache
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: ES Lint
        shell: bash
        run: npm run lint

      - name: Check formatting
        shell: bash
        run: npm run format:check

      - name: Typecheck
        shell: bash
        run: npm run typecheck

  action-deps-pinned:
    runs-on: ubuntu-24.04
    needs: setup-and-cache
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup
        uses: ./.github/actions/setup

      # Fails if ts-apt is linked locally or not pinned to a pushed commit SHA.
      - name: Check Dependency Pins
        shell: bash
        run: npm run check:deps-pin

  testing:
    runs-on: ubuntu-24.04
    needs: setup-and-cache
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test
        shell: bash
        run: npm run test

      - name: Type Coverage
        shell: bash
        run: npx type-coverage --at-least 95

      # NOTE: Requires GH account authorization to http://app.codecov.io
      - name: Upload coverage info
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          slug: "${{ github.repository }}"

      # Make this run last so all previous step failures surface but still run this as well
      - name: Audit NPM dependencies
        if: always()
        shell: bash
        run: npm audit --audit-level=high --omit=dev

  # The integration jobs only need the bundle uploaded by setup-and-cache, so they start as soon as it is
  # ready instead of waiting for tests; ci-passed still fails the run when lint or tests fail.
  list_all_versions:
    runs-on: ubuntu-24.04 # expected versions below are from Ubuntu 24.04
    needs: [setup-and-cache]
    name: List all package versions (including deps).
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      # Every integration job below runs this step first. GitHub-hosted runners try azure.archive.ubuntu.com
      # first, and it sometimes stalls a package download for minutes, which has nothing to do with what the
      # action does. See the action for the measurements, and the README for the user-facing caveat.
      - name: Use archive.ubuntu.com instead of the stalling Azure mirror
        uses: ./.github/actions/use-archive-mirror
      - name: Execute
        id: execute
        uses: ./
        with:
          packages: xdot=1.3-1
          version: ${{ github.run_id }}-${{ github.run_attempt }}-list_all_versions
          debug: ${{ env.DEBUG }}
      - name: Verify
        if: |
          steps.execute.outputs.cache-hit != 'false' ||
          steps.execute.outputs.all-package-version-list != 'fonts-liberation2=1:2.1.5-3,gir1.2-atk-1.0=2.52.0-1build1,gir1.2-freedesktop=1.80.1-1,gir1.2-gdkpixbuf-2.0=2.42.10+dfsg-3ubuntu3.3,gir1.2-gtk-3.0=3.24.41-4ubuntu1.3,gir1.2-harfbuzz-0.0=8.3.0-2build2,gir1.2-pango-1.0=1.52.1+ds-1build1,graphviz=2.42.2-9ubuntu0.1,libann0=1.1.2+doc-9build1,libblas3=3.12.0-3build1.1,libcdt5=2.42.2-9ubuntu0.1,libcgraph6=2.42.2-9ubuntu0.1,libgts-0.7-5t64=0.7.6+darcs121130-5.2build1,libgts-bin=0.7.6+darcs121130-5.2build1,libgvc6=2.42.2-9ubuntu0.1,libgvpr2=2.42.2-9ubuntu0.1,libharfbuzz-gobject0=8.3.0-2build2,liblab-gamut1=2.42.2-9ubuntu0.1,liblapack3=3.12.0-3build1.1,libpangoxft-1.0-0=1.52.1+ds-1build1,libpathplan4=2.42.2-9ubuntu0.1,python3-cairo=1.25.1-2build2,python3-gi-cairo=3.48.2-1,python3-numpy=1:1.26.4+ds-6ubuntu1,xdot=1.3-1'
        run: |
          echo "cache-hit = ${{ steps.execute.outputs.cache-hit }}"
          echo "package-version-list = ${{ steps.execute.outputs.package-version-list }}"
          echo "all-package-version-list = ${{ steps.execute.outputs.all-package-version-list }}"
          echo "diff all-package-version-list"
          diff  <(echo "${{ steps.execute.outputs.all-package-version-list }}" ) <(echo "fonts-liberation2=1:2.1.5-3,gir1.2-atk-1.0=2.52.0-1build1,gir1.2-freedesktop=1.80.1-1,gir1.2-gdkpixbuf-2.0=2.42.10+dfsg-3ubuntu3.3,gir1.2-gtk-3.0=3.24.41-4ubuntu1.3,gir1.2-harfbuzz-0.0=8.3.0-2build2,gir1.2-pango-1.0=1.52.1+ds-1build1,graphviz=2.42.2-9ubuntu0.1,libann0=1.1.2+doc-9build1,libblas3=3.12.0-3build1.1,libcdt5=2.42.2-9ubuntu0.1,libcgraph6=2.42.2-9ubuntu0.1,libgts-0.7-5t64=0.7.6+darcs121130-5.2build1,libgts-bin=0.7.6+darcs121130-5.2build1,libgvc6=2.42.2-9ubuntu0.1,libgvpr2=2.42.2-9ubuntu0.1,libharfbuzz-gobject0=8.3.0-2build2,liblab-gamut1=2.42.2-9ubuntu0.1,liblapack3=3.12.0-3build1.1,libpangoxft-1.0-0=1.52.1+ds-1build1,libpathplan4=2.42.2-9ubuntu0.1,python3-cairo=1.25.1-2build2,python3-gi-cairo=3.48.2-1,python3-numpy=1:1.26.4+ds-6ubuntu1,xdot=1.3-1")
          exit 1
        shell: bash

  list_versions:
    runs-on: ubuntu-24.04 # expected versions below are from Ubuntu 24.04
    needs: [setup-and-cache]
    name: List package versions.
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Use archive.ubuntu.com instead of the stalling Azure mirror
        uses: ./.github/actions/use-archive-mirror
      - name: Execute
        id: execute
        uses: ./
        with:
          packages: xdot rolldice
          version: ${{ github.run_id }}-${{ github.run_attempt }}-list_versions
          debug: ${{ env.DEBUG }}
      - name: Verify
        if: steps.execute.outputs.cache-hit != 'false' || steps.execute.outputs.package-version-list
          != 'rolldice=1.16-1build3,xdot=1.3-1'
        run: |
          echo "cache-hit = ${{ steps.execute.outputs.cache-hit }}"
          echo "package-version-list = ${{ steps.execute.outputs.package-version-list }}"
          echo "diff package-version-list"
          diff  <(echo "${{ steps.execute.outputs.package-version-list }}" ) <(echo "rolldice=1.16-1build3,xdot=1.3-1")
          exit 1
        shell: bash

  standard_workflow_install:
    runs-on: ubuntu-24.04
    needs: [setup-and-cache]
    name: Standard workflow install package and cache.
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Use archive.ubuntu.com instead of the stalling Azure mirror
        uses: ./.github/actions/use-archive-mirror
      - name: Execute
        id: execute
        uses: ./
        with:
          packages: xdot rolldice
          version: ${{ github.run_id }}-${{ github.run_attempt }}-standard_workflow
          debug: ${{ env.DEBUG }}
      - name: Verify
        if: steps.execute.outputs.cache-hit != 'false'
        run: |
          echo "cache-hit = ${{ steps.execute.outputs.cache-hit }}"
          exit 1
        shell: bash

  standard_workflow_install_with_new_version:
    runs-on: ubuntu-24.04
    needs: [standard_workflow_install]
    name: Standard workflow packages with new version.
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Use archive.ubuntu.com instead of the stalling Azure mirror
        uses: ./.github/actions/use-archive-mirror
      - name: Execute
        id: execute
        uses: ./
        with:
          packages: xdot rolldice
          version: ${{ github.run_id }}-${{ github.run_attempt}}-standard_workflow_install_with_new_version
          debug: ${{ env.DEBUG }}
      - name: Verify
        if: steps.execute.outputs.cache-hit != 'false'
        run: |
          echo "cache-hit = ${{ steps.execute.outputs.cache-hit }}"
          exit 1
        shell: bash

  standard_workflow_restore:
    runs-on: ubuntu-24.04
    needs: [standard_workflow_install]
    name: Standard workflow restore cached packages.
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Use archive.ubuntu.com instead of the stalling Azure mirror
        uses: ./.github/actions/use-archive-mirror
      - name: Execute
        id: execute
        uses: ./
        with:
          packages: xdot rolldice
          version: ${{ github.run_id }}-${{ github.run_attempt }}-standard_workflow
          debug: ${{ env.DEBUG }}
      - name: Verify
        if: steps.execute.outputs.cache-hit != 'true'
        run: |
          echo "cache-hit = ${{ steps.execute.outputs.cache-hit }}"
          exit 1
        shell: bash

  standard_workflow_restore_with_packages_out_of_order:
    runs-on: ubuntu-24.04
    needs: [standard_workflow_install]
    name: Standard workflow restore with packages out of order.
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Use archive.ubuntu.com instead of the stalling Azure mirror
        uses: ./.github/actions/use-archive-mirror
      - name: Execute
        id: execute
        uses: ./
        with:
          packages: rolldice xdot
          version: ${{ github.run_id }}-${{ github.run_attempt }}-standard_workflow
          debug: ${{ env.DEBUG }}
      - name: Verify
        if: steps.execute.outputs.cache-hit != 'true'
        run: |
          echo "cache-hit = ${{ steps.execute.outputs.cache-hit }}"
          exit 1
        shell: bash

  standard_workflow_add_package:
    runs-on: ubuntu-24.04
    needs: [standard_workflow_install]
    name: Standard workflow add another package.
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Use archive.ubuntu.com instead of the stalling Azure mirror
        uses: ./.github/actions/use-archive-mirror
      - name: Execute
        id: execute
        uses: ./
        with:
          packages: xdot rolldice distro-info-data
          version: ${{ github.run_id }}-${{ github.run_attempt }}-standard_workflow
          debug: ${{ env.DEBUG }}
      - name: Verify
        if: steps.execute.outputs.cache-hit != 'false'
        run: |
          echo "cache-hit = ${{ steps.execute.outputs.cache-hit }}"
          exit 1
        shell: bash

  standard_workflow_restore_add_package:
    runs-on: ubuntu-24.04
    needs: [standard_workflow_add_package]
    name: Standard workflow restore added package.
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Use archive.ubuntu.com instead of the stalling Azure mirror
        uses: ./.github/actions/use-archive-mirror
      - name: Execute
        id: execute
        uses: ./
        with:
          packages: xdot rolldice distro-info-data
          version: ${{ github.run_id }}-${{ github.run_attempt }}-standard_workflow
          debug: ${{ env.DEBUG }}
      - name: Verify
        if: steps.execute.outputs.cache-hit != 'true'
        run: |
          echo "cache-hit = ${{ steps.execute.outputs.cache-hit }}"
          exit 1
        shell: bash

  no_packages:
    runs-on: ubuntu-24.04
    needs: [setup-and-cache]
    name: No packages passed.
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Use archive.ubuntu.com instead of the stalling Azure mirror
        uses: ./.github/actions/use-archive-mirror
      - name: Execute
        id: execute
        uses: ./
        with:
          packages: ""
        continue-on-error: true
      - name: Verify the action failed
        if: steps.execute.outcome != 'failure'
        run: |
          echo "::error::Expected the action to fail, but its outcome was '${{ steps.execute.outcome }}'."
          exit 1
        shell: bash

  no_packages_warn:
    runs-on: ubuntu-24.04
    needs: [setup-and-cache]
    name: "No packages passed, warn."
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Execute
        id: execute
        uses: ./
        with:
          packages: ""
          empty_packages_behavior: warn
      - name: Verify
        if: steps.execute.outputs.cache-hit != 'false' || steps.execute.outputs.package-version-list != ''
        run: |
          echo "cache-hit = ${{ steps.execute.outputs.cache-hit }}"
          echo "package-version-list = ${{ steps.execute.outputs.package-version-list }}"
          exit 1
        shell: bash

  no_packages_ignore:
    runs-on: ubuntu-24.04
    needs: [setup-and-cache]
    name: "No packages passed, ignore."
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Execute
        id: execute
        uses: ./
        with:
          packages: ""
          empty_packages_behavior: ignore
      - name: Verify
        if: steps.execute.outputs.cache-hit != 'false' || steps.execute.outputs.package-version-list != ''
        run: |
          echo "cache-hit = ${{ steps.execute.outputs.cache-hit }}"
          echo "package-version-list = ${{ steps.execute.outputs.package-version-list }}"
          exit 1
        shell: bash

  package_not_found:
    runs-on: ubuntu-24.04
    needs: [setup-and-cache]
    name: Package not found.
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Use archive.ubuntu.com instead of the stalling Azure mirror
        uses: ./.github/actions/use-archive-mirror
      - name: Execute
        id: execute
        uses: ./
        with:
          packages: package_that_doesnt_exist
        continue-on-error: true
      - name: Verify the action failed
        if: steps.execute.outcome != 'failure'
        run: |
          echo "::error::Expected the action to fail, but its outcome was '${{ steps.execute.outcome }}'."
          exit 1
        shell: bash

  version_contains_spaces:
    runs-on: ubuntu-24.04
    needs: [setup-and-cache]
    name: Version contains spaces.
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Use archive.ubuntu.com instead of the stalling Azure mirror
        uses: ./.github/actions/use-archive-mirror
      - name: Execute
        id: execute
        uses: ./
        with:
          packages: xdot
          version: 123 abc
          debug: ${{ env.DEBUG }}
        continue-on-error: true
      - name: Verify the action failed
        if: steps.execute.outcome != 'failure'
        run: |
          echo "::error::Expected the action to fail, but its outcome was '${{ steps.execute.outcome }}'."
          exit 1
        shell: bash

  regression_36:
    runs-on: ubuntu-24.04
    needs: [setup-and-cache]
    name: "Reinstall existing package (regression issue #36)."
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Use archive.ubuntu.com instead of the stalling Azure mirror
        uses: ./.github/actions/use-archive-mirror
      - uses: ./
        with:
          # Some dependencies (libicu-dev) are already on the runner image, the rest are not.
          packages: libxml2-dev
          version: ${{ github.run_id }}-${{ github.run_attempt }}-regression_36
          debug: ${{ env.DEBUG }}

  regression_37:
    runs-on: ubuntu-24.04
    needs: [setup-and-cache]
    name: "Install with reported package dependencies not installed (regression issue #37)."
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Use archive.ubuntu.com instead of the stalling Azure mirror
        uses: ./.github/actions/use-archive-mirror
      - uses: ./
        with:
          # Python-based packages whose reported dependencies are not all installed.
          packages: python3-tk git-restore-mtime
          version: ${{ github.run_id }}-${{ github.run_attempt }}-regression_37
          debug: ${{ env.DEBUG }}

  debug_disabled:
    runs-on: ubuntu-24.04
    needs: [setup-and-cache]
    name: Debug disabled.
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Use archive.ubuntu.com instead of the stalling Azure mirror
        uses: ./.github/actions/use-archive-mirror
      - uses: ./
        with:
          packages: xdot
          version: ${{ github.run_id }}-${{ github.run_attempt }}-list-all-package-versions
          debug: ${{ env.DEBUG }}

  regression_72_2:
    runs-on: ubuntu-24.04
    needs: [setup-and-cache]
    name: "Cache Java CA certs package v2 (regression issue #72)."
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Use archive.ubuntu.com instead of the stalling Azure mirror
        uses: ./.github/actions/use-archive-mirror
      - uses: ./
