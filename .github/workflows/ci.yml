  regression_76:
    runs-on: ubuntu-24.04
    needs: [setup-and-cache]
    name: "Cache empty archive (regression issue #76)."
    timeout-minutes: 15
    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: Use archive.ubuntu.com instead of the stalling Azure mirror
        uses: ./.github/actions/use-archive-mirror
      # The original report was an Intel oneAPI package whose files have spaces in their
      # paths. libopenal-data ships "/usr/share/openal/hrtf/Default HRTF.mhr" and comes
      # from the Ubuntu archive, so no third-party repo or extra installs are needed.
      - uses: ./
        with:
