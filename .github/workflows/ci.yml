    steps:
      - name: Download Action Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-bundle-${{ github.event.pull_request.head.sha || github.sha }}
