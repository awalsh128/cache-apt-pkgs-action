# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json

# Tokens for release.yml to push release tags, which the tag ruleset only lets the Octo STS app do.
# Octo STS reads this file from the default branch, and only the release workflow running on
# main-2 or staging-2 matches. The subject carries the owner and repository IDs.
issuer: https://token.actions.githubusercontent.com
subject_pattern: "repo:awalsh128@2087466/cache-apt-pkgs-action@408212054:.*"
claim_pattern:
  ref: "refs/heads/(main-2|staging-2)"
  job_workflow_ref: "awalsh128/cache-apt-pkgs-action/\\.github/workflows/release\\.yml@refs/heads/(main-2|staging-2)"

permissions:
  contents: write
